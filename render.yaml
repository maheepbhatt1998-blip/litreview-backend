# Render Blueprint - Infrastructure as Code
services:
  - type: web
    name: litreview-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: litreview-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: litreview-db
    plan: free
    databaseName: litreview
    user: litreview_user
